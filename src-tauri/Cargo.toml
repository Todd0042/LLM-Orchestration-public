[package]
name = "llm-orchestration"
version = "0.1.0"
description = "LLM-Orchestration — Multi-Node AI Agent Chat, Artifact, Media & Terminal Workbench"
edition = "2021"

[lib]
name = "llm_orchestration_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process"] }
